# Small sub-lemmas with a deterministic checker. The checker evaluates a closed arithmetic claim, in place of Lean 4.
- id: L01
  statement: "Energy estimate step. Check that 3**2 + 4**2 == 25."
  check: "3**2 + 4**2 == 25"
- id: L02
  statement: "Young's inequality instance with a=2, b=3. Check that 2*2*3 <= 2**2 + 3**2."
  check: "2*2*3 <= 2**2 + 3**2"
- id: L03
  statement: "Discrete Gronwall step. Check that 2*(1+1) + 1 == 5."
  check: "2*(1+1) + 1 == 5"
- id: L04
  statement: "Sobolev exponent bookkeeping. Check that 1/2 + 1/3 + 1/6 == 1."
  check: "abs(1/2 + 1/3 + 1/6 - 1) < 1e-9"
- id: L05
  statement: "Interpolation instance. Check that 2**3 <= 2**2 * 2**2."
  check: "2**3 <= 2**2 * 2**2"
